name: Release

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: E2E tests
        id: e2e
        run: npm run test:e2e

      - name: Upload Playwright report
        if: failure() && steps.e2e.outcome == 'failure'
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: playwright-report/

      # The build is environment-independent; deployments replace config.json.
      - name: Package
        run: tar -czf "recipes-frontend-${GITHUB_REF_NAME}.tar.gz" -C dist .

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" "recipes-frontend-${GITHUB_REF_NAME}.tar.gz" --title "$GITHUB_REF_NAME" --generate-notes

      - name: Trigger e2e tests in recipes-infrastructure
        env:
          GH_TOKEN: ${{ secrets.E2E_DISPATCH_TOKEN }}
          REPO_NAME: ${{ github.event.repository.name }}
        run: >-
          gh api repos/globz-eu/recipes-infrastructure/dispatches
          -f event_type=component-released
          -f "client_payload[repo]=$REPO_NAME"
          -f "client_payload[version]=$GITHUB_REF_NAME"
