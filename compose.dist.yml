# Override for the recipes-infrastructure dev stack (see scripts/stack.sh dist):
# serves this checkout's dist/ at /frontend/ instead of the released frontend.
services:
  nginx:
    depends_on:
      frontend: !reset null
    volumes:
      - type: bind
        source: ./dist
        target: /usr/share/nginx/html/frontend
        read_only: true
  frontend: !reset null
